<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kb-assistant · 课程助教</title>
<style>
  :root{
    --bg:#faf9f7; --panel:#ffffff; --ink:#1f2328; --soft:#6b7280;
    --line:#e5e2dc; --accent:#2563eb; --user:#eef4ff; --src:#f6f4ef;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:820px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .dot{width:8px;height:8px;border-radius:99px;background:#22c55e}
  header .dot.off{background:#ef4444}
  header .sub{color:var(--soft);font-size:12px;margin-left:auto}
  #chat{flex:1;overflow-y:auto;padding:20px 18px 8px}
  .row{display:flex;margin:14px 0}
  .row.user{justify-content:flex-end}
  .bubble{max-width:82%;padding:12px 14px;border-radius:14px;line-height:1.75;font-size:14.5px;
          white-space:normal;word-break:break-word;animation:fade .18s ease}
  .row.user .bubble{background:var(--user);border:1px solid #dbe7ff;border-bottom-right-radius:4px}
  .row.bot .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .bubble p{margin:.35em 0}
  .bubble pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;overflow-x:auto;font-size:12.5px}
  .bubble code{background:#f1f0ec;padding:1px 5px;border-radius:4px;font-size:12.5px}
  .bubble strong{font-weight:600}
  .cite{color:var(--accent);font-size:11.5px;vertical-align:super}
  .srcbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .srccard{background:var(--src);border:1px solid var(--line);border-radius:8px;
           padding:8px 10px;margin:6px 0;font-size:12px;color:var(--soft)}
  .srccard b{color:var(--ink);font-size:12px}
  .cursor::after{content:"▍";color:var(--accent);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:0}}
  .err{color:#b91c1c;font-size:13px}
  footer{padding:12px 18px 18px;border-top:1px solid var(--line);background:var(--bg)}
  .inputbar{display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
           font:inherit;font-size:14px;min-height:46px;max-height:140px;outline:none;background:#fff}
  textarea:focus{border-color:#c7d2fe;box-shadow:0 0 0 3px #eef2ff}
  button{border:0;border-radius:12px;padding:0 18px;height:46px;background:var(--ink);color:#fff;
         font:inherit;font-size:14px;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  .hint{color:var(--soft);font-size:11.5px;margin-top:6px;text-align:center}
  @media (max-width:600px){ .bubble{max-width:92%} header .sub{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="dot"></span>
    <h1>kb-assistant · 课程助教</h1>
    <span class="sub" id="sub">基于课程语料回答，附来源引用</span>
  </header>
  <div id="chat"></div>
  <footer>
    <div class="inputbar">
      <textarea id="q" rows="1" placeholder="问课程相关的问题，比如：切片大小一般设多少合适？"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · 回答基于课程资料，资料外问题会拒答</div>
  </footer>
</div>
<script>
const chat = document.getElementById('chat');
const qBox = document.getElementById('q');
const sendBtn = document.getElementById('send');
const dot = document.getElementById('dot');
let sessionId = localStorage.getItem('kba_sid') || null;
let busy = false;

// —— 健康检查：小圆点指示服务状态 ——
fetch('/health').then(r => r.json()).then(d => dot.classList.toggle('off', !d.model_ready))
  .catch(() => dot.classList.add('off'));

// —— 极简 Markdown 渲染：加粗 / 行内代码 / 代码块 / 列表 / 引用编号 ——
function renderMd(md){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let html = esc(md);
  html = html.replace(/```([\s\S]*?)```/g, (_,c) => '<pre>'+c+'</pre>');
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([0-9]+)\]/g, '<span class="cite">[$1]</span>');
  html = html.replace(/^### (.*)$/gm, '<p><strong>$1</strong></p>');
  html = html.replace(/^\s*[-*] (.*)$/gm, '· $1<br>');
  html = html.replace(/\n{2,}/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

function addRow(role, html){
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = html;
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

function setBusy(v){
  busy = v;
  sendBtn.disabled = v;
  qBox.disabled = v;
  sendBtn.textContent = v ? '生成中…' : '发送';
}

function ask(){
  const q = qBox.value.trim();
  if(!q || busy) return;

  addRow('user', renderMd(q));
  qBox.value = ''; qBox.style.height = 'auto';
  const bot = addRow('bot', '<span class="cursor"></span>');
  setBusy(true);

  const url = '/api/chat/stream?question=' + encodeURIComponent(q)
            + (sessionId ? '&session_id=' + encodeURIComponent(sessionId) : '');
  const es = new EventSource(url);
  let text = '', sources = [];

  es.addEventListener('token', e => {
    text += JSON.parse(e.data).t;
    bot.innerHTML = renderMd(text) + '<span class="cursor"></span>';
    chat.scrollTop = chat.scrollHeight;
  });
  es.addEventListener('sources', e => { sources = JSON.parse(e.data); });
  es.addEventListener('done', e => {
    sessionId = JSON.parse(e.data).session_id;
    localStorage.setItem('kba_sid', sessionId);
    let html = renderMd(text);
    if(sources.length){
      html += '<div class="srcbox">';
      sources.forEach((s,i) => {
        const snip = s.snippet.replace(/</g,'&lt;');
        html += '<div class="srccard"><b>[' + (i+1) + '] ' + s.doc + '</b><br>' + snip + '…</div>';
      });
      html += '</div>';
    }
    bot.innerHTML = html;
    es.close(); setBusy(false);
  });
  es.onerror = () => {
    es.close();
    bot.innerHTML = '<span class="err">请求失败：服务未响应或网络中断，请重试。</span>';
    setBusy(false);
  };
}

sendBtn.onclick = ask;
qBox.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
});
qBox.addEventListener('input', () => {
  qBox.style.height = 'auto';
  qBox.style.height = Math.min(qBox.scrollHeight, 140) + 'px';
});
</script>
</body>
</html>
